name: Daily GeoGuess Reel

on:
  schedule:
    - cron: "17 16 * * *"        # every day 16:17 UTC (17:17 Berlin winter time / 18:17 summer time)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only render + upload the video, do NOT post to Instagram"
        type: boolean
        default: true

permissions:
  contents: write                 # create releases (video hosting) + commit history.json

concurrency:
  group: geobot
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg + Python packages
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r requirements.txt

      - name: Cache map data + voice model
        uses: actions/cache@v4
        with:
          path: |
            data/naturalearth
            models
          key: assets-${{ vars.PIPER_VOICE || 'en_US-ryan-high' }}-kokoro-v2

      - name: Download map data + voice model
        env:
          PIPER_VOICE: ${{ vars.PIPER_VOICE || 'en_US-ryan-high' }}
        run: bash scripts/fetch_assets.sh

      - name: Render reel (real Mapillary panoramas + AI voice)
        env:
          MAPILLARY_TOKEN: ${{ secrets.MAPILLARY_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TTS_ENGINE: ${{ vars.TTS_ENGINE || 'openai' }}
          OPENAI_VOICE: ${{ vars.OPENAI_VOICE || 'cedar' }}
          VOICE_STYLE: ${{ vars.VOICE_STYLE }}
          VOICE_AI_CHECK: ${{ vars.VOICE_AI_CHECK }}
          VOICE_QA_TRIES: ${{ vars.VOICE_QA_TRIES }}
          VOICE_MAX_PITCH_HZ: ${{ vars.VOICE_MAX_PITCH_HZ }}
          VOICE_MAX_JUMPS: ${{ vars.VOICE_MAX_JUMPS }}
          VOICE_MAX_SWING: ${{ vars.VOICE_MAX_SWING }}
          AUDIO_FX: ${{ vars.AUDIO_FX }}
          AUDIO_WARMTH: ${{ vars.AUDIO_WARMTH }}
          AUDIO_REVERB: ${{ vars.AUDIO_REVERB }}
          AUDIO_DEESSER: ${{ vars.AUDIO_DEESSER }}
          OPENAI_SPEED: ${{ vars.OPENAI_SPEED }}
          OPENAI_TTS_MODEL: ${{ vars.OPENAI_TTS_MODEL || 'gpt-realtime-2.1' }}
          VISION_MODEL: ${{ vars.VISION_MODEL || 'gpt-5-mini' }}
          VISION_CHECK: ${{ vars.VISION_CHECK || '1' }}
          KOKORO_VOICE: ${{ vars.KOKORO_VOICE || 'am_michael' }}
          KOKORO_SPEED: ${{ vars.KOKORO_SPEED || '0.9' }}
          PIPER_VOICE: ${{ vars.PIPER_VOICE || 'en_US-ryan-high' }}
          ROUNDS_PER_REEL: ${{ vars.ROUNDS_PER_REEL || '2' }}
          VOICE_PITCH: ${{ vars.VOICE_PITCH || '1.0' }}
          VOICE_SPEED: ${{ vars.VOICE_SPEED || '1.4' }}
          REQUIRE_ROAD: ${{ vars.REQUIRE_ROAD || '1' }}
          RADIUS_KM: ${{ vars.RADIUS_KM || '2000' }}
          TITLE_EDITION: ${{ vars.TITLE_EDITION || 'World Edition' }}
        run: python -m bot.main render --out out

      - name: Host video as GitHub release asset (public URL for Instagram)
        id: host
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="reel-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$TAG" out/reel.mp4 --title "$TAG" --notes-file out/caption.txt
          echo "url=https://github.com/${{ github.repository }}/releases/download/$TAG/reel.mp4" >> "$GITHUB_OUTPUT"

      - name: Publish to Instagram
        if: github.event_name == 'schedule' || inputs.dry_run == false
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python -m bot.main publish --out out --video-url "${{ steps.host.outputs.url }}"

      - name: Save history (also keeps the schedule alive)
        if: always()
        run: |
          git config user.name "geobot"
          git config user.email "geobot@users.noreply.github.com"
          git add data/history.json
          git commit -m "history: $(date -u +%F)" || echo "nothing to commit"
          git push || true

      - name: Delete old video releases (keep last 10)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName,createdAt -q 'sort_by(.createdAt) | reverse | .[10:] | .[].tagName' \
            | grep '^reel-' | while read -r t; do gh release delete "$t" --yes --cleanup-tag; done || true
